<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartEntry Login</title>

    <link rel="icon" type="image/png" href="/smartentry-mark.png">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="login-page">

<div class="login-grid"></div>
<button type="button" class="theme-toggle login-theme-toggle" id="loginThemeToggle" aria-label="Toggle theme"><span>☀</span></button>
<div class="container vh-100 d-flex justify-content-center align-items-center position-relative">
    <div class="card login-card p-4">
        <div class="login-brand mb-4">
            <img src="/smartentry-mark.png" alt="" class="login-brand-mark">
            <div><strong>SmartEntry</strong><span>VISITOR MANAGEMENT · v1.0</span></div>
        </div>

        <p class="login-intro">Sign in to access the security console</p>

        <form id="loginForm">
            <div class="mb-3">
                <label>EMAIL ADDRESS</label>

                <input
                    type="email"
                    class="form-control"
                    id="email">
            </div>

            <div class="mb-3">
                <label>PASSWORD</label>

                <input
                    type="password"
                    class="form-control"
                    id="password">
            </div>

            <button class="btn btn-primary w-100 login-submit">
                Sign In
            </button>
        </form>
        <div class="login-footer">SECURE ACCESS · SMARTENTRY PLATFORM</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/src/scripts/login.js"></script>
<script>
    const savedTheme = localStorage.getItem('smartentryTheme') || 'dark';
    document.documentElement.dataset.theme = savedTheme;
    document.getElementById('loginThemeToggle').addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('smartentryTheme', next);
    });
</script>

</body>
</html>
